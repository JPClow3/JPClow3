name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * mon"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main-writes
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # NOTE: Pin third-party actions by commit SHA when network policy allows
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: JPClow3
          outputs: |
            assets/generated/snake.svg

      - name: Commit snake to main if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/snake.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update contribution snake [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
